<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password - Aurelius Bank</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar"><div class="container"><div class="logo"><span>⟡</span> Aurelius Bank</div></div></nav><main><section class="page-header"><div class="container"><h1>Forgot Password</h1></div></section><section class="content"><div class="container" style="max-width:500px;margin:3rem auto"><form onsubmit="handleForgotPassword(event)"><div class="form-group"><label for="email">Enter your email</label><input type="email" id="email" name="email" required></div><button type="submit" class="btn-primary">Send Reset Link</button></form><p style="text-align:center;margin-top:1rem"><a href="/login">Back to Login</a></p></div></section></main><footer class="footer"><p>&copy; 2024 Aurelius Bank</p></footer><style>.form-group{margin:1.5rem 0}.form-group label{display:block;margin-bottom:.5rem;font-weight:600}.form-group input{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:.5rem}.btn-primary{width:100%;padding:.75rem;background:var(--primary);color:white;border:none;border-radius:.5rem;cursor:pointer;font-size:1rem}.footer{background:var(--primary);color:white;padding:2rem 0;text-align:center;margin-top:3rem}</style><script>function handleForgotPassword(e){e.preventDefault();alert('Check your email for password reset instructions');}</script></body></html>
