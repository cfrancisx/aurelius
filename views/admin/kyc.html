<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification - Aurelius Bank Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="logo">AURELIUS ADMIN</div>
            <nav class="admin-nav">
                <a href="/admin">📊 Dashboard</a>
                <a href="/admin/customers">👥 Customers</a>
                <a href="/admin/transactions">💰 Transactions</a>
                <a href="/admin/balance-management">⚖️ Balance Management</a>
                <a href="/admin/kyc" class="active">✅ KYC Verification</a>
                <a href="/admin/loans">🏦 Loan Approval</a>
                <a href="/admin/audit-logs">📝 Audit Logs</a>
            </nav>
        </aside>
        
        <main class="admin-main">
            <header class="admin-header">
                <h1>KYC Verification</h1>
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </header>
            
            <div class="card">
                <h3>Pending KYC Verification</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Account Number</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="kycTable">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- KYC Documents Modal -->
    <div id="kycDocsModal" class="modal">
        <div class="modal-content" style="max-width: 720px;">
            <span class="close" onclick="closeModal('kycDocsModal')" style="cursor:pointer; float:right; font-size:1.5rem;">&times;</span>
            <h3 id="kycDocsTitle">KYC Documents</h3>
            <div id="kycDocsBody" style="display:flex; gap:1.5rem; flex-wrap:wrap; margin-top:1rem;">
                Loading...
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const customers = await api.getCustomers();
                // Show anyone awaiting review (pending) so the admin can view their documents.
                const pendingKYC = customers.filter(c => c.kyc_status === 'pending');
                const tbody = document.getElementById('kycTable');

                if (pendingKYC.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:1.5rem; color:#999;">No customers awaiting KYC review</td></tr>';
                    return;
                }

                tbody.innerHTML = pendingKYC.map(c => `
                    <tr>
                        <td>${c.first_name} ${c.last_name}</td>
                        <td>${c.email}</td>
                        <td>${c.account_number}</td>
                        <td><span class="badge badge-${c.kyc_status}">${c.kyc_status}</span></td>
                        <td>
                            <button onclick="viewKYCDocuments('${c._id}', '${c.first_name} ${c.last_name}')" class="btn-sm">View Documents</button>
                            <button onclick="updateKYCStatus('${c._id}', 'verified')" class="btn-sm">Approve</button>
                            <button onclick="updateKYCStatus('${c._id}', 'rejected')" class="btn-sm">Reject</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showToast('Failed to load KYC data', 'error');
            }
        });

        async function viewKYCDocuments(customerId, name) {
            const modal = document.getElementById('kycDocsModal');
            const body = document.getElementById('kycDocsBody');
            document.getElementById('kycDocsTitle').textContent = `KYC Documents — ${name}`;
            body.innerHTML = 'Loading...';
            modal.style.display = 'block';
            modal.classList.add('show');

            try {
                const res = await fetch(`/api/admin/customers/${customerId}/kyc-documents`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Failed to load documents');
                }
                const docs = await res.json();

                const renderDoc = (label, doc) => {
                    if (!doc.data_uri) {
                        return `<div style="flex:1; min-width:240px;"><strong>${label}</strong><p style="color:#999;">Not uploaded</p></div>`;
                    }
                    // PDFs can't render in <img>; offer a link instead.
                    const isPdf = (doc.mime || '').includes('pdf');
                    const preview = isPdf
                        ? `<a href="${doc.data_uri}" target="_blank" class="btn-sm">Open PDF (${doc.name || 'document'})</a>`
                        : `<img src="${doc.data_uri}" alt="${label}" style="max-width:100%; border-radius:0.5rem; border:1px solid #ddd;">`;
                    return `<div style="flex:1; min-width:240px;"><strong>${label}</strong><div style="margin-top:0.5rem;">${preview}</div></div>`;
                };

                body.innerHTML = renderDoc('ID Document', docs.id_document) + renderDoc('Selfie Photo', docs.selfie_photo);
            } catch (error) {
                body.innerHTML = `<p style="color:#C62828;">${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
