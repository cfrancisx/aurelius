<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Aurelius Bank Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="logo">AURELIUS ADMIN</div>
            <nav class="admin-nav">
                <a href="/admin">📊 Dashboard</a>
                <a href="/admin/customers">👥 Customers</a>
                <a href="/admin/transactions">💰 Transactions</a>
                <a href="/admin/balance-management">⚖️ Balance Management</a>
                <a href="/admin/kyc">✅ KYC Verification</a>
                <a href="/admin/loans">🏦 Loan Approval</a>
                <a href="/admin/audit-logs">📝 Audit Logs</a>
                <a href="/admin/settings" class="active">⚙️ Settings</a>
            </nav>
        </aside>
        
        <main class="admin-main">
            <header class="admin-header">
                <h1>System Settings</h1>
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </header>
            
            <div class="card">
                <h3>Application Settings</h3>
                <form id="settingsForm">
                    <div class="form-group">
                        <label>Maintenance Mode</label>
                        <input type="checkbox" id="maintenanceMode"> Enable Maintenance Mode
                    </div>
                    
                    <div class="form-group">
                        <label>Transfer Limit (USD)</label>
                        <input type="number" id="transferLimit" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Savings Interest Rate (%)</label>
                        <input type="number" id="savingsRate" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Loan Interest Rate (%)</label>
                        <input type="number" id="loanRate" class="form-control" step="0.01" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const settings = await api.request('/admin/settings');
                document.getElementById('maintenanceMode').checked = settings.maintenance_mode;
                document.getElementById('transferLimit').value = settings.transfer_limit;
                document.getElementById('savingsRate').value = settings.savings_interest_rate;
                document.getElementById('loanRate').value = settings.loan_interest_rate;
            } catch (error) {
                showToast('Failed to load settings', 'error');
            }
        });
        
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.request('/admin/settings', {
                    method: 'PUT',
                    body: JSON.stringify({
                        maintenance_mode: document.getElementById('maintenanceMode').checked,
                        transfer_limit: parseFloat(document.getElementById('transferLimit').value),
                        savings_interest_rate: parseFloat(document.getElementById('savingsRate').value),
                        loan_interest_rate: parseFloat(document.getElementById('loanRate').value)
                    })
                });
                showToast('Settings saved successfully', 'success');
            } catch (error) {
                showToast('Failed to save settings', 'error');
            }
        });
    </script>
</body>
</html>
