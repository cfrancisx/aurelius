<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Account - Aurelius Bank</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #003D82 0%, #002B5C 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .auth-card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 2.5rem 2rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .banker-welcome {
            width: 80px;
            height: 110px;
            margin: 0 auto 1.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 3px solid #003D82;
            background: white;
        }

        .banker-welcome img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            color: #003D82;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .auth-subtitle {
            color: #666666;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-grid .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #E0E3E8;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #003D82;
            box-shadow: 0 0 0 3px rgba(0, 61, 130, 0.1);
            background: white;
        }

        .error-message {
            background: #FFEBEE;
            color: #C62828;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-left: 4px solid #D32F2F;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border-left: 4px solid #00AA62;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-register {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: #003D82;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1.5rem;
        }

        .btn-register:hover {
            background: #002B5C;
            box-shadow: 0 4px 16px rgba(0, 61, 130, 0.2);
        }

        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        .loading-spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E0E3E8;
        }

        .auth-footer p {
            color: #666666;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: #003D82;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #002B5C;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem 1rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="banker-welcome">
                    <img src="/images/banker-female-2.svg" alt="Aurelius Bank Team">
                </div>
                <div class="auth-logo">🏦</div>
                <h1>Aurelius Bank</h1>
                <p class="auth-subtitle">Open Your Account Today</p>
            </div>

            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+44 7123 456789">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" required placeholder="123 Main Street">
                </div>

                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>
                    <input type="date" id="date_of_birth" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Create a strong password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" required placeholder="Re-enter your password">
                </div>

                <button type="submit" class="btn-register">
                    <span class="loading-spinner" id="loading"></span>
                    <span id="btnText">Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script>
        const api = {
            async request(endpoint, options = {}) {
                const token = localStorage.getItem('token');
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token && { 'Authorization': `Bearer ${token}` }),
                        ...options.headers,
                    }
                });

                return response;
            },

            async register(data) {
                const response = await this.request('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                return response.json();
            }
        };

        const form = document.getElementById('registerForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const loading = document.getElementById('loading');
        const btnText = document.getElementById('btnText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const date_of_birth = document.getElementById('date_of_birth').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            if (!first_name || !last_name) {
                errorDiv.textContent = 'Please enter your full name';
                errorDiv.classList.add('show');
                return;
            }

            if (password !== confirm_password) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters long';
                errorDiv.classList.add('show');
                return;
            }

            loading.classList.add('show');
            btnText.textContent = 'Creating Account...';

            try {
                const result = await api.register({
                    first_name,
                    last_name,
                    email,
                    phone,
                    address,
                    date_of_birth,
                    password,
                    account_type: 'personal'
                });

                if (result.error) {
                    errorDiv.textContent = result.error;
                    errorDiv.classList.add('show');
                    loading.classList.remove('show');
                    btnText.textContent = 'Create Account';
                } else if (result.token || result.user) {
                    successDiv.textContent = 'Account created successfully! Proceeding to ID verification...';
                    successDiv.classList.add('show');
                    loading.classList.remove('show');
                    
                    // Store token temporarily for ID verification
                    if (result.token) {
                        localStorage.setItem('token', result.token);
                    }
                    
                    setTimeout(() => {
                        window.location.href = '/register/id-verification';
                    }, 1500);
                }
            } catch (error) {
                errorDiv.textContent = 'Registration failed. Please try again.';
                errorDiv.classList.add('show');
                loading.classList.remove('show');
                btnText.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
