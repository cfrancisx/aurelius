<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#F5F7FA"/>
  
  <!-- Head -->
  <circle cx="150" cy="100" r="50" fill="#8B6F47"/>
  
  <!-- Hair -->
  <path d="M 100 80 Q 100 30 150 30 Q 200 30 200 80 L 200 90 Q 195 110 150 120 Q 105 110 100 90 Z" fill="#2A1F15"/>
  
  <!-- Ears -->
  <ellipse cx="95" cy="105" rx="10" ry="22" fill="#8B6F47"/>
  <ellipse cx="205" cy="105" rx="10" ry="22" fill="#8B6F47"/>
  
  <!-- Eyes -->
  <circle cx="130" cy="98" r="6.5" fill="#1A1A1A"/>
  <circle cx="170" cy="98" r="6.5" fill="#1A1A1A"/>
  <circle cx="132" cy="95" r="2.5" fill="white"/>
  <circle cx="172" cy="95" r="2.5" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M 120 80 Q 130 74 140 80" stroke="#2A1F15" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 160 80 Q 170 74 180 80" stroke="#2A1F15" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <line x1="150" y1="92" x2="150" y2="112" stroke="#735A3A" stroke-width="2.5"/>
  
  <!-- Mouth (confident smile) -->
  <path d="M 133 127 Q 150 137 167 127" stroke="#6B4423" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Business Suit (Navy) -->
  <rect x="80" y="160" width="140" height="160" rx="20" fill="#0D3B66"/>
  
  <!-- White Dress Shirt -->
  <rect x="100" y="160" width="100" height="85" fill="white"/>
  
  <!-- Tie (Blue & Gold) -->
  <rect x="143" y="165" width="14" height="65" fill="#003D82"/>
  <polygon points="143,165 157,165 159,173 150,177 141,173" fill="#0052A3"/>
  
  <!-- Pocket Square -->
  <rect x="85" y="200" width="12" height="12" fill="#FFD700"/>
  
  <!-- Jacket details -->
  <ellipse cx="90" cy="190" rx="8" ry="15" fill="#0D3B66"/>
  <ellipse cx="210" cy="190" rx="8" ry="15" fill="#0D3B66"/>
  
  <!-- Arms -->
  <rect x="48" y="185" width="32" height="105" rx="16" fill="#8B6F47"/>
  <rect x="220" y="185" width="32" height="105" rx="16" fill="#8B6F47"/>
  
  <!-- Hands -->
  <circle cx="64" cy="295" r="17" fill="#8B6F47"/>
  <circle cx="236" cy="295" r="17" fill="#8B6F47"/>
</svg>