<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Document -->
  <rect x="30" y="20" width="140" height="160" rx="5" fill="#F5F7FA" stroke="#0052A3" stroke-width="2"/>
  
  <!-- Document header -->
  <rect x="30" y="20" width="140" height="30" rx="5" fill="linear-gradient(135deg, #003D82 0%, #0052A3 100%)" stroke="#0052A3" stroke-width="2"/>
  <text x="100" y="42" font-size="14" fill="white" text-anchor="middle" font-weight="bold">STATEMENT</text>
  
  <!-- Lines representing text -->
  <line x1="45" y1="70" x2="155" y2="70" stroke="#0052A3" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="85" x2="155" y2="85" stroke="#0052A3" stroke-width="2" opacity="0.5"/>
  <line x1="45" y1="100" x2="130" y2="100" stroke="#0052A3" stroke-width="2" opacity="0.4"/>
  
  <!-- Amount box -->
  <rect x="40" y="120" width="120" height="35" rx="3" fill="rgba(0, 170, 98, 0.1)" stroke="#00AA62" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="100" y="130" font-size="10" fill="#666" text-anchor="middle">Total Amount</text>
  <text x="100" y="148" font-size="14" fill="#00AA62" text-anchor="middle" font-weight="bold">£1,234.56</text>
  
  <!-- Checkmark -->
  <path d="M 155 155 L 165 165 L 175 150" fill="none" stroke="#00AA62" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>