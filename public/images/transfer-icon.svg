<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow pointing right with speed lines -->
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AA62;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Speed lines -->
  <line x1="20" y1="80" x2="60" y2="80" stroke="#0052A3" stroke-width="3" opacity="0.6"/>
  <line x1="30" y1="60" x2="65" y2="60" stroke="#0052A3" stroke-width="3" opacity="0.4"/>
  <line x1="25" y1="100" x2="58" y2="100" stroke="#0052A3" stroke-width="3" opacity="0.5"/>
  
  <!-- Main arrow -->
  <g transform="translate(100, 100)">
    <!-- Arrow shaft -->
    <rect x="-40" y="-12" width="70" height="24" rx="6" fill="url(#speedGrad)"/>
    
    <!-- Arrow head -->
    <polygon points="40,-16 40,16 65,0" fill="url(#speedGrad)"/>
  </g>
  
  <!-- Circles around arrow representing global reach -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#0052A3" stroke-width="1.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#00AA62" stroke-width="1.5" opacity="0.2"/>
</svg>