<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Chart bars -->
  <defs>
    <linearGradient id="chartGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#003D82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052A3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0052A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AA62;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bar 1 -->
  <rect x="30" y="110" width="25" height="70" rx="3" fill="url(#chartGrad1)"/>
  
  <!-- Bar 2 -->
  <rect x="65" y="80" width="25" height="100" rx="3" fill="url(#chartGrad2)"/>
  
  <!-- Bar 3 -->
  <rect x="100" y="100" width="25" height="80" rx="3" fill="url(#chartGrad1)"/>
  
  <!-- Bar 4 -->
  <rect x="135" y="60" width="25" height="120" rx="3" fill="url(#chartGrad2)"/>
  
  <!-- Axis -->
  <line x1="20" y1="185" x2="170" y2="185" stroke="#0052A3" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="185" x2="20" y2="30" stroke="#0052A3" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Growth arrow -->
  <path d="M 150 120 L 170 60 L 155 75" fill="none" stroke="#00AA62" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>