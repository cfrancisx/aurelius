<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#F5F7FA"/>
  
  <!-- Head -->
  <circle cx="150" cy="100" r="50" fill="#F4C5A0"/>
  
  <!-- Hair (long) -->
  <path d="M 100 70 Q 100 30 150 30 Q 200 30 200 70 Q 200 90 195 110 Q 150 125 105 110 Q 100 90 100 70" fill="#2D5016"/>
  
  <!-- Ears -->
  <ellipse cx="95" cy="100" rx="12" ry="25" fill="#F4C5A0"/>
  <ellipse cx="205" cy="100" rx="12" ry="25" fill="#F4C5A0"/>
  
  <!-- Eyes -->
  <circle cx="130" cy="95" r="7" fill="#5C4033"/>
  <circle cx="170" cy="95" r="7" fill="#5C4033"/>
  <circle cx="132" cy="92" r="2.5" fill="white"/>
  <circle cx="172" cy="92" r="2.5" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M 120 78 Q 130 73 140 78" stroke="#2D5016" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 160 78 Q 170 73 180 78" stroke="#2D5016" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <line x1="150" y1="90" x2="150" y2="110" stroke="#E6B89C" stroke-width="2"/>
  
  <!-- Mouth (smile) -->
  <path d="M 135 125 Q 150 135 165 125" stroke="#D17766" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Professional Blazer (grey) -->
  <rect x="80" y="160" width="140" height="160" rx="20" fill="#4A4A4A"/>
  
  <!-- Blouse -->
  <rect x="100" y="160" width="100" height="90" fill="#E8D5C4"/>
  
  <!-- Necklace -->
  <circle cx="150" cy="175" r="4" fill="#FFD700"/>
  <circle cx="142" cy="182" r="3" fill="#FFD700"/>
  <circle cx="158" cy="182" r="3" fill="#FFD700"/>
  
  <!-- Jacket lapels -->
  <polygon points="130,165 100,200 130,190" fill="#3A3A3A"/>
  <polygon points="170,165 200,200 170,190" fill="#3A3A3A"/>
  
  <!-- Arms -->
  <rect x="45" y="180" width="35" height="110" rx="18" fill="#F4C5A0"/>
  <rect x="220" y="180" width="35" height="110" rx="18" fill="#F4C5A0"/>
  
  <!-- Hands -->
  <circle cx="62" cy="295" r="18" fill="#F4C5A0"/>
  <circle cx="238" cy="295" r="18" fill="#F4C5A0"/>
  
  <!-- Hair strand detail -->
  <path d="M 110 50 Q 115 60 112 75" stroke="#2D5016" stroke-width="1.5" fill="none"/>
</svg>