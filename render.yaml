services:
  - type: web
    name: aurelius-bank
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        value: aurelius-bank-jwt-secret-key-production
      - key: SESSION_SECRET
        value: aurelius-bank-session-secret-key
      - key: ADMIN_EMAIL
        value: aureliusadmin@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin12345
      - key: MONGODB_URI
        value: mongodb+srv://aurelius_admin:Admin12345@cluster0.3mottii.mongodb.net/?appName=Cluster0
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    healthCheckPath: /login
    headers:
      - http:
          paths:
            - path: /
              match: prefix
